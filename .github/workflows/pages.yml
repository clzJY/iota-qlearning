name: Verify and publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install numerical dependency
        run: python -m pip install numpy==2.5.3
      - name: Check algorithm and saved evidence
        run: |
          python -m unittest discover -s code -p 'test_*.py' -v
          python scripts/verify_project.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload self-contained report
        uses: actions/upload-pages-artifact@v4
        with:
          path: report
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
